[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reboot-android"
version = "0.1.0.dev0"
description = "Safely and reversibly disable preinstalled ads and bloat on Android phones, using ADB."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.9", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pyyaml>=6"]

[project.scripts]
reboot = "reboot.cli:app"

[tool.setuptools.packages.find]
include = ["reboot*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = ["device: runs against a real phone (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"reboot/cli.py" = ["B008"]  # typer.Option in defaults is the Typer idiom
"tests/**" = ["E501"]
